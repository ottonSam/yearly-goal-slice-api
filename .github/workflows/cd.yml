name: cd
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validar secret da chave (sem vazar)
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_KEY:-}" || (echo "SSH_PRIVATE_KEY está vazio" && exit 1)
          printf "%s" "$SSH_KEY" | sed 's/\r$//' > /tmp/key
          chmod 600 /tmp/key
          ssh-keygen -lf /tmp/key

      - name: Conectar via SSH e Deploy
        uses: appleboy/ssh-action@v1.8.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ~/yearly-goal-slice-api
            git pull origin main
            docker compose down
            docker compose up --build -d
