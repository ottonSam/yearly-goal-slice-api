name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      APP_ENV: "dev"
      DJANGO_DB_ENGINE: ${{ secrets.DJANGO_DB_ENGINE }}
      DJANGO_DB_NAME: ${{ secrets.POSTGRES_DB }}
      DJANGO_DB_USER: ${{ secrets.POSTGRES_USER }}
      DJANGO_DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      DJANGO_DB_HOST: ${{ secrets.POSTGRES_DB_HOST }}
      DJANGO_DB_PORT: ${{ secrets.POSTGRES_DB_PORT }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Write .env for compose
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          env = {
              "DJANGO_SECRET_KEY": os.environ["DJANGO_SECRET_KEY"],
              "DJANGO_DEBUG": os.environ.get("DJANGO_DEBUG", "False"),
              "DJANGO_ALLOWED_HOSTS": os.environ.get("DJANGO_ALLOWED_HOSTS", ""),
              "APP_ENV": os.environ.get("APP_ENV", ""),
              "DJANGO_DB_ENGINE": os.environ.get("DJANGO_DB_ENGINE", ""),
              "DJANGO_DB_NAME": os.environ.get("DJANGO_DB_NAME", ""),
              "DJANGO_DB_USER": os.environ.get("DJANGO_DB_USER", ""),
              "DJANGO_DB_PASSWORD": os.environ.get("DJANGO_DB_PASSWORD", ""),
              "DJANGO_DB_HOST": os.environ.get("DJANGO_DB_HOST", ""),
              "DJANGO_DB_PORT": os.environ.get("DJANGO_DB_PORT", ""),
              "POSTGRES_DB": os.environ.get("POSTGRES_DB", ""),
              "POSTGRES_USER": os.environ.get("POSTGRES_USER", ""),
              "POSTGRES_PASSWORD": os.environ.get("POSTGRES_PASSWORD", ""),
              "SMTP_HOST": os.environ.get("SMTP_HOST", ""),
              "SMTP_PORT": os.environ.get("SMTP_PORT", ""),
              "SMTP_SENDER": os.environ.get("SMTP_SENDER", ""),
              "SMTP_PASSWORD": os.environ.get("SMTP_PASSWORD", ""),
              "SMTP_USE_TLS": os.environ.get("SMTP_USE_TLS", ""),
              "SMTP_USE_SSL": os.environ.get("SMTP_USE_SSL", ""),
          }

          content = "\n".join(f"{k}={v}" for k, v in env.items()) + "\n"
          Path(".env").write_text(content)
          PY

      - name: Build images
        run: docker compose build

      - name: Start database
        run: docker compose up -d db

      - name: Run migrations
        run: docker compose run --rm api /app/.venv/bin/python manage.py migrate

      - name: Run tests
        run: docker compose run --rm api /app/.venv/bin/python manage.py test

      - name: Shutdown
        if: always()
        run: docker compose down -v
